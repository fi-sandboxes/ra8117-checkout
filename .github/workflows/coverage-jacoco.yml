# G4: a second coverage format - JaCoCo XML in an artifact whose name contains "coverage".
name: Coverage JaCoCo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-jacoco
          path: fixtures/coverage-jacoco.xml
