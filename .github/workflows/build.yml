# The build: every pull request and every push to main. Publishes the unit-test JUnit report
# (artifact "unit-tests") and the Cobertura coverage report (artifact "coverage").
name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: reports/unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/cobertura-coverage.xml
